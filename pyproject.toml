[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "queryweave"
version = "0.1.0"
description = "Python SDK and plugin layer for the QueryWeave Rust adaptive hybrid retrieval engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vahid Tavakkoli" }]
keywords = ["search", "hybrid-search", "rust", "bm25", "vector-search", "retrieval", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
plugins = ["fastembed>=0.7"]
dev = ["pytest>=8.3", "maturin>=1.9"]

[project.urls]
Homepage = "https://github.com/vtavakkoli/QueryWeave"
Repository = "https://github.com/vtavakkoli/QueryWeave"
Issues = "https://github.com/vtavakkoli/QueryWeave/issues"
Changelog = "https://github.com/vtavakkoli/QueryWeave/blob/main/CHANGELOG.md"
Documentation = "https://github.com/vtavakkoli/QueryWeave/tree/main/docs"

[tool.maturin]
manifest-path = "crates/queryweave-python/Cargo.toml"
python-source = "python"
module-name = "queryweave._native"
features = ["pyo3/extension-module"]
