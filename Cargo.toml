[workspace]
members = [
  "crates/queryweave-core",
  "crates/queryweave-server",
  "crates/queryweave-python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["Vahid Tavakkoli"]
repository = "https://github.com/vtavakkoli/QueryWeave"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
