name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.9,<2.0'
      - run: maturin build --release --out dist
      - name: Install and import built wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import queryweave
          from queryweave import QueryWeaveClient, QueryWeaveHTTPError

          assert queryweave.__version__
          assert QueryWeaveClient is not None
          assert QueryWeaveHTTPError is not None
          print(f"queryweave {queryweave.__version__} import OK")
          PY

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag queryweave:ci .
      - name: Start QueryWeave
        run: docker run --detach --name queryweave-ci --publish 7777:7777 queryweave:ci
      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7777/health >/tmp/queryweave-health.json; then
              cat /tmp/queryweave-health.json
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs queryweave-ci
              exit 1
            fi
            sleep 1
          done
      - name: Verify index and search flow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent \
            -X POST http://127.0.0.1:7777/v1/documents:upsert \
            -H 'content-type: application/json' \
            -d '{"documents":[{"id":"ci-doc","text":"hydraulic pump temperature failure","source":"ci"}]}' \
            >/tmp/queryweave-upsert.json
          curl --fail --silent \
            -X POST http://127.0.0.1:7777/v1/search \
            -H 'content-type: application/json' \
            -d '{"query":"hydraulic pump failure","limit":5,"mode":"auto","explain":true}' \
            >/tmp/queryweave-search.json
          python - <<'PY'
          import json

          with open('/tmp/queryweave-upsert.json', encoding='utf-8') as handle:
              upsert = json.load(handle)
          with open('/tmp/queryweave-search.json', encoding='utf-8') as handle:
              search = json.load(handle)

          assert upsert['accepted'] == 1, upsert
          assert search['hits'], search
          assert search['hits'][0]['id'] == 'ci-doc', search
          print(json.dumps(search, indent=2))
          PY
      - name: Container logs
        if: always()
        run: docker logs queryweave-ci || true
